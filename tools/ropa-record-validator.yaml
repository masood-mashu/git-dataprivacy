name: ropa-record-validator
version: 1.0.0
description: "Validates mandatory GDPR Article 30 required fields in processing activity record"
input_schema:
  type: object
  properties:
    ropa_entry_json:
      type: string
      description: "JSON with purpose, data_categories, recipients, lawful_basis"
  required:
    - ropa_entry_json
implementation:
  type: script
  path: ropa_record_validator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
