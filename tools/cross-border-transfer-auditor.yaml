name: cross-border-transfer-auditor
version: 1.0.0
description: "Verifies adequacy decision or executed SCC agreement for international transfers"
input_schema:
  type: object
  properties:
    transfer_json:
      type: string
      description: "JSON with destination_country and has_scc_executed"
  required:
    - transfer_json
implementation:
  type: script
  path: cross_border_transfer_auditor.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
